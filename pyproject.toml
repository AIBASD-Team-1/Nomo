[project]
name = "nomo"
version = "0.1.0"
description = "Nomo CAD prompt web application"
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.13.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
